<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Zabbix Spatial Mapping - v5.0 Complete Features</title>
  <!-- Libraries: Konva (Canvas) and Turf (Geometry) -->
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; }
    
    /* Left Sidebar */
    #sidebar { width: 340px; background: #fff; border-right: 1px solid #ddd; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.05); z-index: 10; }
    .section-title { font-size: 13px; font-weight: bold; color: #333; margin-bottom: 8px; border-bottom: 2px solid #007bff; padding-bottom: 4px; }
    
    /* Sensor Items */
    .sensor-item { border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; cursor: grab; background: #fff; display: flex; align-items: center; transition: background 0.2s; }
    .sensor-item:hover { background: #f8f9fa; border-color: #ccc; }
    .sensor-item img { width: 22px; height: 22px; margin-right: 10px; pointer-events: none; }
    .sensor-item span { font-size: 12px; font-weight: 600; color: #444; pointer-events: none; }

    /* Forms & Controls */
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #666; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    .form-row { display: flex; gap: 6px; }

    .btn { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; width: 100%; transition: background 0.2s; }
    .btn:hover { background: #0056b3; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #218838; }
    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #bd2130; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }

    /* Main Area & Canvas */
    #main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
    #stage-container { flex: 1; background: #fcfcfc; }
    #status-bar { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.95); padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 5; }
    .status-idle { color: #555; }
    .status-valid { color: #2e7d32; border-left: 4px solid #2e7d32; }
    .status-error { color: #c62828; border-left: 4px solid #c62828; }

    /* Inventory Table */
    #inventory-panel { height: 180px; background: #fff; border-top: 1px solid #ddd; padding: 10px 15px; overflow-y: auto; }
    #inventory-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: left; }
    #inventory-table th { background: #f1f3f5; padding: 6px; border-bottom: 1px solid #ccc; color: #444; }
    #inventory-table td { padding: 6px; border-bottom: 1px solid #eee; }
    .btn-sm { padding: 2px 6px; font-size: 10px; width: auto; }
  </style>
</head>
<body>

  <!-- Left Sidebar -->
  <div id="sidebar">
    
    <!-- 1. Hotel / Multi-Room Floor Wizard -->
    <div>
    <div class="section-title">1. Bulk Floor Generator Wizard</div>
    <!-- این Dropdown جدید اضافه شده است -->
    <div class="form-group">
        <label>Corridor / Layout Style:</label>
        <select id="wiz-layout" class="form-control">
        <option value="double-row">Double Row (Classic Hotel Corridor)</option>
        <option value="single-row">Single Row Straight Corridor</option>
        <option value="l-shape">L-Shaped Turning Corridor</option>
        <option value="grid">Grid / Matrix Layout</option>
        </select>
    </div>
    <div class="form-group">
        <label>Start Room Number & Count:</label>
        <div class="form-row">
        <input type="number" id="wiz-start" class="form-control" value="101" placeholder="Start (101)">
        <input type="number" id="wiz-count" class="form-control" value="20" placeholder="Count (20)">
        </div>
    </div>
    <div class="form-group">
        <label>Room Dimensions (W x H):</label>
        <div class="form-row">
        <input type="number" id="wiz-w" class="form-control" value="100" placeholder="Width">
        <input type="number" id="wiz-h" class="form-control" value="80" placeholder="Height">
        </div>
    </div>
    <button id="generate-floor-btn" class="btn btn-success">Generate Floor Layout</button>
    </div>

    <!-- 2. Add Single Room Tool -->
    <div>
      <div class="section-title">2. Add Individual Room</div>
      <div class="form-group">
        <label>Room Name:</label>
        <input type="text" id="single-name" class="form-control" value="Room 105" placeholder="e.g. Room 105 or VIP">
      </div>
      <div class="form-group">
        <label>Dimensions (W x H):</label>
        <div class="form-row">
          <input type="number" id="single-w" class="form-control" value="120" placeholder="Width">
          <input type="number" id="single-h" class="form-control" value="90" placeholder="Height">
        </div>
      </div>
      <button id="add-single-room-btn" class="btn btn-secondary">Add Single Room</button>
    </div>

    <!-- 3. Sensor Drag & Drop Library -->
    <div>
      <div class="section-title">3. Drag & Drop Sensors</div>
      <div class="sensor-item" draggable="true" data-type="temperature">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIj48cGF0aCBkPSJNNCAxMWw4IDhNNCAxMWwxNiAxNk00IDExLTggOE00IDExbDE2LTE2TSA5IDE4IEMgOSAxNCw0 IDEyLDQgMTIiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSIyIi8+PC9zdmc+">
        <span>Temperature</span>
      </div>
      <div class="sensor-item" draggable="true" data-type="humidity">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIj48cGF0aCBkPSJNNCAxMWw4IDhNNCAxMWwxNiAxNk00IDExLTggOE00IDExbDE2LTE2TSA5IDE4IEMgOSAxNCw0 IDEyLDQgMTIiLz48Y2lyY2xlIGN4PSI4IiBjeT0iMTAiIHI9IjIiLz48Y2lyY2xlIGN4PSIxNiIgY3k9IjEwIiByPSIyIi8+PC9zdmc+">
        <span>Humidity</span>
      </div>
      <div class="sensor-item" draggable="true" data-type="voltage">
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJibGFjayIgc3Ryb2tlLXdpZHRoPSIyIj48cGF0aCBkPSJNNCAxMWw4IDhNNCAxMWwxNiAxNk00IDExLTggOE00IDExbDE2LTE2TSA5IDE4IEMgOSAxNCw0 IDEyLDQgMTIiLz48cGF0aCBkPSJNMTMgNWwtNSA1aDZsLTUgNSIvPjwvc3ZnPg==">
        <span>Voltage</span>
      </div>
    </div>

    <!-- 4. Global Bulk Placement Engine -->
    <div>
      <div class="section-title">4. Bulk Sensor Rules (All Rooms)</div>
      <div class="form-group">
        <label>Sensor Type:</label>
        <select id="bulk-type" class="form-control">
          <option value="temperature">Temperature</option>
          <option value="humidity">Humidity</option>
          <option value="voltage">Voltage</option>
        </select>
      </div>
      <div class="form-group">
         <label>Placement Positions (Select Multiple):</label>
         <div style="font-size: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #f8f9fa; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
            <label style="grid-column: span 2; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 3px;"><input type="checkbox" class="bulk-pos" value="center" checked> Center </label>
            <label><input type="checkbox" class="bulk-pos" value="top-left" checked> Top-Left</label>
            <label><input type="checkbox" class="bulk-pos" value="top-right" checked> Top-Right</label>
            <label><input type="checkbox" class="bulk-pos" value="bottom-left" checked> Bottom-Left</label>
            <label><input type="checkbox" class="bulk-pos" value="bottom-right" checked> Bottom-Right</label>
      </div>
</div>
      <button id="apply-bulk-btn" class="btn">Apply Bulk Placement</button>
    </div>

  </div>

  <!-- Main Canvas Content -->
  <div id="main-content">
  <div id="stage-container"></div>
  <div id="status-bar" class="status-idle">Status: Ready. Scroll mouse wheel to zoom, drag empty space to pan.</div>

  <!-- این دکمه‌های شناور کنترل زوم اضافه شده‌اند -->
  <div class="canvas-controls">
    <button id="zoom-in-btn" class="btn btn-secondary btn-icon" title="Zoom In">+</button>
    <button id="zoom-out-btn" class="btn btn-secondary btn-icon" title="Zoom Out">-</button>
    <button id="reset-zoom-btn" class="btn btn-secondary btn-icon" title="Reset View">⟲</button>
  </div>

  <div id="inventory-panel">
        <thead>
          <tr>
            <th>ID</th>
            <th>Room / Location</th>
            <th>Sensor Type</th>
            <th>Coordinates (X, Y)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventory-body">
          <!-- Dynamic Rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // --- 1. System Config & State ---
    const CONFIG = {
      canvasWidth: 950,
      canvasHeight: 520,
      placementOffset: 20
    };

    let mapRooms = {
      'Map Boundary': { coords: [[0, 0], [CONFIG.canvasWidth, 0], [CONFIG.canvasWidth, CONFIG.canvasHeight], [0, CONFIG.canvasHeight], [0, 0]], type: 'boundary' }
    };

    let selectedSensorGroup = null;

    // --- 2. Initialize Konva Scene & Transformer ---
    const stage = new Konva.Stage({
  container: 'stage-container',
  width: CONFIG.defaultWidth,
  height: CONFIG.defaultHeight,
  draggable: true // قابلیت Drag بوم برای Pan کردن
});

// موتور محاسبه Zoom و Scroll
function applyZoom(scaleFactor, center = null) {
  const oldScale = stage.scaleX();
  let newScale = Math.max(0.3, Math.min(oldScale * scaleFactor, 3.0));

  const pointer = center || { x: stage.width() / 2, y: stage.height() / 2 };
  const mousePointTo = {
    x: (pointer.x - stage.x()) / oldScale,
    y: (pointer.y - stage.y()) / oldScale,
  };

  stage.scale({ x: newScale, y: newScale });
  stage.position({
    x: pointer.x - mousePointTo.x * newScale,
    y: pointer.y - mousePointTo.y * newScale,
  });
  stage.batchDraw();
}

stage.on('wheel', (e) => {
  e.evt.preventDefault();
  applyZoom(e.evt.deltaY < 0 ? 1.1 : 0.9, stage.getPointerPosition());
});

document.getElementById('zoom-in-btn').addEventListener('click', () => applyZoom(1.2));
document.getElementById('zoom-out-btn').addEventListener('click', () => applyZoom(0.8));
document.getElementById('reset-zoom-btn').addEventListener('click', () => {
  stage.scale({ x: 1, y: 1 });
  stage.position({ x: 0, y: 0 });
  stage.batchDraw();
});

// تابع بزرگ‌تر کردن خودکار ابعاد Canvas متناسب با تعداد اتاق‌ها
function ensureCanvasBounds(maxX, maxY) {
  const targetW = Math.max(CONFIG.defaultWidth, maxX + 200);
  const targetH = Math.max(CONFIG.defaultHeight, maxY + 200);
  stage.width(targetW);
  stage.height(targetH);
  mapRooms['Map Boundary'].coords = [[0, 0], [targetW, 0], [targetW, targetH], [0, targetH], [0, 0]];
}

    const mapLayer = new Konva.Layer();
    const sensorLayer = new Konva.Layer();
    stage.add(mapLayer);
    stage.add(sensorLayer);

    // Konva Transformer for Visual Resizing
    const roomTransformer = new Konva.Transformer({
      nodes: [],
      rotateEnabled: false,
      enabledAnchors: ['top-left', 'top-right', 'bottom-left', 'bottom-right', 'middle-left', 'middle-right', 'top-center', 'bottom-center'],
      boundBoxFunc: (oldBox, newBox) => {
        if (newBox.width < 40 || newBox.height < 40) return oldBox;
        return newBox;
      }
    });
    mapLayer.add(roomTransformer);

    // --- 3. Render Map & Rooms ---
    function renderMap() {
      mapLayer.getChildren(node => node !== roomTransformer).forEach(node => node.destroy());

      Object.keys(mapRooms).forEach(name => {
        const room = mapRooms[name];
        if (room.type === 'boundary') return;

        const coords = room.coords;
        const x = coords[0][0];
        const y = coords[0][1];
        const width = coords[2][0] - coords[0][0];
        const height = coords[2][1] - coords[0][1];

        const roomGroup = new Konva.Group({
          x: x,
          y: y,
          draggable: true,
          name: name
        });

        const rect = new Konva.Rect({
          width: width,
          height: height,
          fill: room.type === 'corridor' ? '#fff3e0' : '#e3f2fd',
          stroke: '#333',
          strokeWidth: 2,
          name: 'rect'
        });
        roomGroup.add(rect);

        const text = new Konva.Text({
          x: 8,
          y: 8,
          text: name,
          fontSize: 11,
          fontStyle: 'bold',
          fill: '#333'
        });
        roomGroup.add(text);

        // Click to Select & Resize
        roomGroup.on('click tap', (e) => {
          e.cancelBubble = true;
          roomTransformer.nodes([roomGroup]);
          updateStatus('idle', `Selected ${name}. Drag handles to resize room!`);
        });

        // Parent-Child Drag Sync
        let prevX = 0;
        let prevY = 0;
        roomGroup.on('dragstart', function() {
          prevX = this.x();
          prevY = this.y();
        });

        roomGroup.on('dragmove', function() {
          const dx = this.x() - prevX;
          const dy = this.y() - prevY;

          sensorLayer.getChildren().forEach(sensor => {
            if (sensor.getAttr('zabbix_room') === name) {
              sensor.x(sensor.x() + dx);
              sensor.y(sensor.y() + dy);
            }
          });

          prevX = this.x();
          prevY = this.y();
          sensorLayer.draw();
        });

        // Recalculate Turf Polygon on Resize/Move End
        const updateRoomState = function() {
          const rx = roomGroup.x();
          const ry = roomGroup.y();
          const scaleX = roomGroup.scaleX();
          const scaleY = roomGroup.scaleY();

          roomGroup.scaleX(1);
          roomGroup.scaleY(1);

          const newWidth = Math.round(rect.width() * scaleX);
          const newHeight = Math.round(rect.height() * scaleY);
          rect.width(newWidth);
          rect.height(newHeight);

          mapRooms[name].coords = [
            [rx, ry],
            [rx + newWidth, ry],
            [rx + newWidth, ry + newHeight],
            [rx, ry + newHeight],
            [rx, ry]
          ];

          sensorLayer.getChildren().forEach(sensor => {
            if (sensor.getAttr('zabbix_room') === name) {
              sensor.setAttr('lastValidPos', { x: sensor.x(), y: sensor.y() });
            }
          });

          mapLayer.draw();
          updateInventoryTable();
        };

        roomGroup.on('dragend', updateRoomState);
        roomGroup.on('transformend', updateRoomState);

        mapLayer.add(roomGroup);
      });

      mapLayer.draw();
    }

    stage.on('click tap', (e) => {
      if (e.target === stage || e.target.name() === 'boundary') {
        roomTransformer.nodes([]);
        selectSensor(null);
      }
    });

    // --- 4. Floor Generator Wizard Logic ---
    document.getElementById('generate-floor-btn').addEventListener('click', () => {
  const layoutStyle = document.getElementById('wiz-layout').value;
  const startNum = parseInt(document.getElementById('wiz-start').value) || 101;
  const count = parseInt(document.getElementById('wiz-count').value) || 20;
  const roomW = parseInt(document.getElementById('wiz-w').value) || 100;
  const roomH = parseInt(document.getElementById('wiz-h').value) || 80;

  const corridorWidth = 50;
  const startX = 40;
  const startY = 40;

  mapRooms = { 'Map Boundary': mapRooms['Map Boundary'] };
  let maxCanvasX = 0;
  let maxCanvasY = 0;

  if (layoutStyle === 'double-row') {
    const topRow = Math.ceil(count / 2);
    const bottomRow = count - topRow;

    for (let i = 0; i < topRow; i++) {
      const roomName = `Room ${startNum + i}`;
      const x = startX + (i * roomW);
      const y = startY;
      mapRooms[roomName] = { coords: [[x, y], [x + roomW, y], [x + roomW, y + roomH], [x, y + roomH], [x, y]], type: 'room' };
    }

    const corridorW = Math.max(topRow, bottomRow) * roomW;
    const corridorY = startY + roomH;
    mapRooms['Main Corridor'] = { coords: [[startX, corridorY], [startX + corridorW, corridorY], [startX + corridorW, corridorY + corridorWidth], [startX, corridorY + corridorWidth], [startX, corridorY]], type: 'corridor' };

    for (let i = 0; i < bottomRow; i++) {
      const roomName = `Room ${startNum + topRow + i}`;
      const x = startX + (i * roomW);
      const y = corridorY + corridorWidth;
      mapRooms[roomName] = { coords: [[x, y], [x + roomW, y], [x + roomW, y + roomH], [x, y + roomH], [x, y]], type: 'room' };
    }

    maxCanvasX = startX + corridorW;
    maxCanvasY = corridorY + corridorWidth + roomH;

  } else if (layoutStyle === 'single-row') {
    for (let i = 0; i < count; i++) {
      const roomName = `Room ${startNum + i}`;
      const x = startX + (i * roomW);
      const y = startY;
      mapRooms[roomName] = { coords: [[x, y], [x + roomW, y], [x + roomW, y + roomH], [x, y + roomH], [x, y]], type: 'room' };
    }

    const totalW = count * roomW;
    mapRooms['Main Corridor'] = { coords: [[startX, startY + roomH], [startX + totalW, startY + roomH], [startX + totalW, startY + roomH + corridorWidth], [startX, startY + roomH + corridorWidth], [startX, startY + roomH]], type: 'corridor' };

    maxCanvasX = startX + totalW;
    maxCanvasY = startY + roomH + corridorWidth;

  } else if (layoutStyle === 'l-shape') {
    const leg1 = Math.ceil(count / 2);
    const leg2 = count - leg1;

    for (let i = 0; i < leg1; i++) {
      const roomName = `Room ${startNum + i}`;
      const x = startX + (i * roomW);
      const y = startY;
      mapRooms[roomName] = { coords: [[x, y], [x + roomW, y], [x + roomW, y + roomH], [x, y + roomH], [x, y]], type: 'room' };
    }

    const horizCorridorW = (leg1 * roomW) + corridorWidth;
    mapRooms['Horizontal Corridor'] = { coords: [[startX, startY + roomH], [startX + horizCorridorW, startY + roomH], [startX + horizCorridorW, startY + roomH + corridorWidth], [startX, startY + roomH + corridorWidth], [startX, startY + roomH]], type: 'corridor' };

    const vertStartX = startX + (leg1 * roomW);
    for (let i = 0; i < leg2; i++) {
      const roomName = `Room ${startNum + leg1 + i}`;
      const x = vertStartX + corridorWidth;
      const y = startY + roomH + corridorWidth + (i * roomH);
      mapRooms[roomName] = { coords: [[x, y], [x + roomW, y], [x + roomW, y + roomH], [x, y + roomH], [x, y]], type: 'room' };
    }

    const vertCorridorH = (leg2 * roomH);
    mapRooms['Vertical Corridor'] = { coords: [[vertStartX, startY + roomH + corridorWidth], [vertStartX + corridorWidth, startY + roomH + corridorWidth], [vertStartX + corridorWidth, startY + roomH + corridorWidth + vertCorridorH], [vertStartX, startY + roomH + corridorWidth + vertCorridorH], [vertStartX, startY + roomH + corridorWidth]], type: 'corridor' };

    maxCanvasX = vertStartX + corridorWidth + roomW;
    maxCanvasY = startY + roomH + corridorWidth + vertCorridorH;

  } else if (layoutStyle === 'grid') {
    const cols = Math.ceil(Math.sqrt(count));
    const gap = 30;

    for (let i = 0; i < count; i++) {
      const roomName = `Room ${startNum + i}`;
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = startX + (col * (roomW + gap));
      const y = startY + (row * (roomH + gap));
      mapRooms[roomName] = { coords: [[x, y], [x + roomW, y], [x + roomW, y + roomH], [x, y + roomH], [x, y]], type: 'room' };

      maxCanvasX = Math.max(maxCanvasX, x + roomW);
      maxCanvasY = Math.max(maxCanvasY, y + roomH);
    }
  }

  ensureCanvasBounds(maxCanvasX, maxCanvasY);
  renderMap();
  updateStatus('idle', `Generated ${count} rooms in ${layoutStyle} layout.`);
});

    // --- 5. Add Individual Single Room Logic ---
    document.getElementById('add-single-room-btn').addEventListener('click', () => {
      const roomName = document.getElementById('single-name').value.trim() || `Room ${Math.floor(Math.random()*100 + 100)}`;
      const roomW = parseInt(document.getElementById('single-w').value) || 120;
      const roomH = parseInt(document.getElementById('single-h').value) || 90;

      const startX = 50;
      const startY = 50;

      mapRooms[roomName] = {
        coords: [[startX, startY], [startX + roomW, startY], [startX + roomW, startY + roomH], [startX, startY + roomH], [startX, startY]],
        type: 'room'
      };

      renderMap();
      updateStatus('idle', `Added single room: ${roomName}`);
    });

    // --- 6. Spatial Validation Engine ---
    function validateLocation(x, y) {
      const point = turf.point([x, y]);

      const mapPoly = turf.polygon([mapRooms['Map Boundary'].coords]);
      if (!turf.booleanPointInPolygon(point, mapPoly)) {
        updateStatus('error', 'Error: Sensor outside boundary!');
        return false;
      }

      let targetRoomId = null;
      for (const [name, room] of Object.entries(mapRooms)) {
        if (room.type === 'boundary') continue;
        const roomPoly = turf.polygon([room.coords]);
        if (turf.booleanPointInPolygon(point, roomPoly)) {
          targetRoomId = name;
          break;
        }
      }

      if (!targetRoomId) {
        updateStatus('error', 'Error: Drop sensor inside a room or corridor!');
        return false;
      }

      updateStatus('valid', `Valid position inside ${targetRoomId}`);
      return { room: targetRoomId };
    }

    function updateStatus(type, message) {
      const bar = document.getElementById('status-bar');
      bar.textContent = `Status: ${message}`;
      bar.className = `status-${type}`;
    }

    // --- 7. Vector Sensor Rendering ---
    const SENSOR_ICONS = {
      base: () => new Konva.RegularPolygon({ sides: 6, radius: 10, fill: 'white', stroke: 'black', strokeWidth: 1.5, y: -2 }),
      stem: () => new Konva.Line({ points: [0, -2, 0, -22], stroke: 'black', strokeWidth: 1.5, lineCap: 'round' }),

      temperature: () => {
        const g = new Konva.Group();
        g.add(SENSOR_ICONS.stem());
        g.add(SENSOR_ICONS.base());
        g.add(new Konva.Line({ points: [-5, -2, 5, -2], stroke: 'black', strokeWidth: 1.5 }));
        g.add(new Konva.Line({ points: [0, -7, 0, 3], stroke: 'black', strokeWidth: 1.5 }));
        return g;
      },
      humidity: () => {
        const g = new Konva.Group();
        g.add(SENSOR_ICONS.stem());
        g.add(SENSOR_ICONS.base());
        g.add(new Konva.Circle({ cx: -4, cy: -2, radius: 2, fill: 'black' }));
        g.add(new Konva.Circle({ cx: 4, cy: -2, radius: 2, fill: 'black' }));
        return g;
      },
      voltage: () => {
        const g = new Konva.Group();
        g.add(SENSOR_ICONS.base());
        g.add(new Konva.Line({ points: [1, -7, -2, -2, 2, -2, -1, 3], stroke: 'black', strokeWidth: 1.5 }));
        return g;
      }
    };

    function createSensor(x, y, type, targetRoom) {
      const sensorId = `sensor_${Math.floor(Math.random() * 10000)}`;
      const group = new Konva.Group({ x, y, draggable: true, id: sensorId });

      group.add(SENSOR_ICONS[type] ? SENSOR_ICONS[type]() : SENSOR_ICONS.temperature());

      const highlight = new Konva.Circle({ radius: 14, stroke: '#007bff', strokeWidth: 2, dash: [4, 4], visible: false, name: 'highlight' });
      group.add(highlight);

      group.setAttrs({ zabbix_room: targetRoom, zabbix_type: type, lastValidPos: { x, y } });

      group.on('click tap', (e) => {
        e.cancelBubble = true;
        selectSensor(group);
      });

      group.on('dragmove', function() { validateLocation(this.x(), this.y()); });

      group.on('dragend', function() {
        const validation = validateLocation(this.x(), this.y());
        if (validation) {
          this.setAttrs({ zabbix_room: validation.room, lastValidPos: { x: this.x(), y: this.y() } });
        } else {
          const lastPos = this.getAttr('lastValidPos');
          this.to({ x: lastPos.x, y: lastPos.y, duration: 0.2 });
          validateLocation(lastPos.x, lastPos.y);
        }
        updateInventoryTable();
      });

      return group;
    }

    function selectSensor(group) {
      sensorLayer.find('.highlight').forEach(h => h.visible(false));
      if (group) {
        selectedSensorGroup = group;
        const hl = group.findOne('.highlight');
        if (hl) hl.visible(true);
        updateStatus('idle', `Selected Sensor: ${group.id()}. Press [Delete] to remove.`);
      } else {
        selectedSensorGroup = null;
      }
      sensorLayer.draw();
    }

    function deleteSensor(sensorId) {
      const sensor = sensorLayer.findOne(`#${sensorId}`);
      if (sensor) {
        sensor.destroy();
        selectedSensorGroup = null;
        sensorLayer.draw();
        updateInventoryTable();
      }
    }

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'Delete' || e.key === 'Backspace') && selectedSensorGroup) {
        deleteSensor(selectedSensorGroup.id());
      }
    });

    // --- 8. Drag Drop Sensor Library ---
    const sidebar = document.getElementById('sidebar');
    const stageContainer = stage.container();
    let currentDragType = null;

    sidebar.addEventListener('dragstart', (e) => {
      const item = e.target.closest('.sensor-item');
      if (item) currentDragType = item.getAttribute('data-type');
    });

   stageContainer.addEventListener('dragover', (e) => e.preventDefault());

stageContainer.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!currentDragType) return;

  const stageBox = stageContainer.getBoundingClientRect();
  
  // محاسبه مختصات دقیق با در نظر گرفتن Pan و Zoom
  const pointer = {
    x: (e.clientX - stageBox.left - stage.x()) / stage.scaleX(),
    y: (e.clientY - stageBox.top - stage.y()) / stage.scaleY()
  };

  const validation = validateLocation(pointer.x, pointer.y);
  if (validation) {
    const newSensor = createSensor(pointer.x, pointer.y, currentDragType, validation.room);
    sensorLayer.add(newSensor);
    sensorLayer.draw();
    updateInventoryTable();
  }

  currentDragType = null;
});

// --- 9. Advanced Bulk Rules Engine (Center / Corners) ---
document.getElementById('apply-bulk-btn').addEventListener('click', () => {
  const selectedType = document.getElementById('bulk-type').value;
  const selectedPositions = Array.from(document.querySelectorAll('.bulk-pos:checked')).map(cb => cb.value);

  if (selectedPositions.length === 0) {
    alert('Please select at least one placement position!');
    return;
  }

  Object.keys(mapRooms).forEach(name => {
    const room = mapRooms[name];
    if (room.type !== 'room') return;

    const bbox = turf.bbox(turf.polygon([room.coords])); // [xmin, ymin, xmax, ymax]
    const offset = CONFIG.placementOffset;

    const posMap = {
      'center': { x: (bbox[0] + bbox[2]) / 2, y: (bbox[1] + bbox[3]) / 2 },
      'top-left': { x: bbox[0] + offset, y: bbox[1] + offset },
      'top-right': { x: bbox[2] - offset, y: bbox[1] + offset },
      'bottom-left': { x: bbox[0] + offset, y: bbox[3] - offset },
      'bottom-right': { x: bbox[2] - offset, y: bbox[3] - offset }
    };

    selectedPositions.forEach(posKey => {
      if (posMap[posKey]) {
        const sensor = createSensor(posMap[posKey].x, posMap[posKey].y, selectedType, name);
        sensorLayer.add(sensor);
      }
    });
  });

  sensorLayer.draw();
  updateInventoryTable();
  updateStatus('idle', `Applied bulk sensors to selected positions across all rooms.`);
});
    // --- 10. Live Inventory & Export ---
    function updateInventoryTable() {
      const tbody = document.getElementById('inventory-body');
      tbody.innerHTML = '';

      sensorLayer.getChildren().forEach(sensor => {
        const id = sensor.id();
        const room = sensor.getAttr('zabbix_room');
        const type = sensor.getAttr('zabbix_type');
        const x = Math.round(sensor.x());
        const y = Math.round(sensor.y());

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${id}</strong></td>
          <td>${room}</td>
          <td>${type.toUpperCase()}</td>
          <td>X: ${x}, Y: ${y}</td>
          <td><button class="btn btn-danger btn-sm" onclick="deleteSensor('${id}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('export-json-btn').addEventListener('click', () => {
      const exportData = sensorLayer.getChildren().map(s => ({
        id: s.id(),
        room: s.getAttr('zabbix_room'),
        type: s.getAttr('zabbix_type'),
        coordinates: { x: Math.round(s.x()), y: Math.round(s.y()) }
      }));
      console.log('Zabbix Map Export Data:', JSON.stringify(exportData, null, 2));
      alert('Data exported to Browser Console (F12)!');
    });

    // Initial Default Floor Layout
    document.getElementById('generate-floor-btn').click();
  </script>
</body>
