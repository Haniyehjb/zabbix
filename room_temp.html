<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Room Monitoring - Zabbix</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: white;
            margin: 0;
            overflow: hidden;
        }

        /* Top Header */
        header {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 1.5rem; color: #8be9fd; text-shadow: 0 0 10px rgba(139, 233, 253, 0.5); }
        p { margin: 5px 0 0 0; font-size: 0.85rem; color: #6272a4; }

        /* 3D Canvas Container */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Control Panel for Adding Sensors */
        .control-panel {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(33, 34, 44, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #6272a4;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
            width: 260px;
        }
        .control-panel h3 { margin: 0 0 10px 0; color: #8be9fd; font-size: 1.1rem; }
        .form-group { margin-bottom: 8px; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; color: #f8f8f2; margin-bottom: 2px; }
        .form-group input { 
            width: 100%; 
            padding: 6px; 
            background: #282a36; 
            border: 1px solid #44475a; 
            color: #f8f8f2; 
            border-radius: 4px; 
            box-sizing: border-box;
            font-size: 0.85rem;
        }
        .coord-group { display: flex; gap: 5px; }
        .coord-group input { width: 33%; }

        .btn-add {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #50fa7b;
            color: #282a36;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-add:hover { background: #5af78e; }

        /* Sensor Pop-up Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #21222c;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 1px solid #6272a4;
            width: 320px;
            text-align: center;
            z-index: 100;
        }

        .modal h2 { margin-top: 0; color: #8be9fd; font-size: 1.3rem; }
        .temp-display { font-size: 3rem; font-weight: bold; margin: 15px 0; color: #50fa7b; transition: color 0.3s ease; }
        .temp-display.alarm { color: #ff5555; animation: pulse 1s infinite; }
        .status-badge { padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
        .status-ok { background: #50fa7b; color: #282a36; }
        .status-alarm { background: #ff5555; color: white; }
        .close-btn { 
            margin-top: 20px; 
            padding: 10px 20px; 
            background: #6272a4; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #bd93f9; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Instruction Hint */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40, 42, 54, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #f8f8f2;
            pointer-events: none;
            border: 1px solid #44475a;
        }
    </style>

    <!-- Load Three.js Engine and GLTF Loader directly via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <header>
        <h1>Server Room 3D Digital Twin</h1>
        <p>Interactive Sensor Monitoring connected to Zabbix</p>
    </header>

    <!-- Add Sensor UI Panel -->
    <div class="control-panel">
        <h3>➕ Add New Sensor</h3>
        <form id="addSensorForm">
            <div class="form-group">
                <label for="sensorTitle">Sensor Display Name</label>
                <input type="text" id="sensorTitle" value="Server Rack Sensor" required>
            </div>
            <div class="form-group">
                <label for="itemKey">Zabbix Item Key</label>
                <input type="text" id="itemKey" value="room.temp" required>
            </div>
            <div class="form-group">
                <label>3D Coordinates (X, Y, Z)</label>
                <div class="coord-group">
                    <input type="number" id="posX" step="0.1" value="0.0" required>
                    <input type="number" id="posY" step="0.1" value="1.5" required>
                    <input type="number" id="posZ" step="0.1" value="0.0" required>
                </div>
            </div>
            <button type="submit" class="btn-add">Add Sensor to Room</button>
        </form>
    </div>

    <div class="hint">🖱️ Left Click + Drag to rotate | Scroll to Zoom | Click a sensor to view live data</div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Sensor Details Popup Modal -->
    <div class="modal" id="sensorModal">
        <h2 id="sensorName">Server Room Temp Sensor</h2>
        <div class="temp-display" id="tempValue">-- °C</div>
        <div>Status: <span id="statusBadge" class="status-badge status-ok">NORMAL</span></div>
        <button class="close-btn" onclick="closeModal()">Close</button>
    </div>

   <script>
    // ==========================================
    // 1. ZABBIX API CONFIGURATION
    // ==========================================
    const ZABBIX_URL = "http://localhost:8080/zabbix/api_jsonrpc.php";
    const API_TOKEN = ""; 
    const HOST_NAME = "Server Room"; // Default host in Zabbix

    let updateInterval = null;
    let sensorCount = 1;

    // ==========================================
    // 2. THREE.JS SCENE SETUP
    // ==========================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const clickableObjects = [];

    // ==========================================
    // 3. LOAD MODEL & PLACE INITIAL SENSORS
    // ==========================================
    const loader = new THREE.GLTFLoader();
    
    loader.load('room.glb', function (gltf) {
        const roomModel = gltf.scene;
        scene.add(roomModel);
        
        // Initial default sensor
        create3DSensorNode(0, 2, 1.1, "Server Rack Temp #1", "room.temp");

    }, undefined, function (error) {
        console.log("No custom GLB found, loading fallback room...");
        createMock3DRoom();
    });

    function createMock3DRoom() {
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x282a36, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = Math.PI / 2;
        scene.add(floor);

        const boxGeo = new THREE.BoxGeometry(2, 3, 2);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x44475a });
        const rack = new THREE.Mesh(boxGeo, boxMat);
        rack.position.set(0, 1.5, 0);
        scene.add(rack);

        // --- INITIAL SENSOR PLACEMENT ---
        create3DSensorNode(0, 2, 1.1, "Server Rack Temp #1", "room.temp");
    }

    // Helper to spawn interactive 3D Sensor spheres
    function create3DSensorNode(x, y, z, sensorName, zabbixItemKey) {
        const sensorGeo = new THREE.SphereGeometry(0.25, 32, 32);
        const sensorMat = new THREE.MeshStandardMaterial({ 
            color: 0x6272a4, 
            emissive: 0x6272a4, 
            emissiveIntensity: 0.5 
        });
        const sensorMesh = new THREE.Mesh(sensorGeo, sensorMat);
        sensorMesh.position.set(x, y, z);
        
        // Bind both the Display Name and the Zabbix Item Key to the mesh metadata
        sensorMesh.userData = { 
            name: sensorName, 
            itemKey: zabbixItemKey, 
            isSensor: true 
        };
        
        scene.add(sensorMesh);
        clickableObjects.push(sensorMesh);
    }

    // ==========================================
    // 4. MANUAL SENSOR FORM HANDLING
    // ==========================================
    document.getElementById('addSensorForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const title = document.getElementById('sensorTitle').value;
        const key = document.getElementById('itemKey').value;
        const x = parseFloat(document.getElementById('posX').value);
        const y = parseFloat(document.getElementById('posY').value);
        const z = parseFloat(document.getElementById('posZ').value);

        // Create 3D sphere node in scene
        create3DSensorNode(x, y, z, title, key);

        // Update default form inputs to make consecutive additions easy
        sensorCount++;
        document.getElementById('sensorTitle').value = `Server Rack Sensor #${sensorCount}`;
        document.getElementById('posX').value = (Math.random() * 6 - 3).toFixed(1);
        document.getElementById('posZ').value = (Math.random() * 6 - 3).toFixed(1);
    });

    // ==========================================
    // 5. MOUSE CLICK / RAYCASTING DETECTION
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', onPointerClick);

    function onPointerClick(event) {
        // Prevent click raycasting when clicking form controls
        if (event.target.closest('.control-panel')) return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(clickableObjects);

        if (intersects.length > 0) {
            const clickedSensor = intersects[0].object;
            if (clickedSensor.userData.isSensor) {
                openSensorModal(clickedSensor.userData.name, clickedSensor.userData.itemKey);
            }
        }
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ==========================================
    // 6. DYNAMIC ZABBIX FETCH & MODAL LOGIC
    // ==========================================
    async function fetchSensorData(itemKey) {
        try {
            const response = await fetch(ZABBIX_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json-rpc" },
                body: JSON.stringify({
                    jsonrpc: "2.0",
                    method: "item.get",
                    params: {
                        output: ["lastvalue", "units"],
                        filter: { host: HOST_NAME, key_: itemKey }
                    },
                    auth: API_TOKEN,
                    id: 1
                })
            });

            const data = await response.json();
            
            if (data.result && data.result.length > 0) {
                const lastVal = parseFloat(data.result[0].lastvalue).toFixed(1);
                const units = data.result[0].units || "°C";

                const tempEl = document.getElementById("tempValue");
                const statusBadge = document.getElementById("statusBadge");

                tempEl.innerText = `${lastVal} ${units}`;

                if (lastVal > 30.0) {
                    tempEl.classList.add("alarm");
                    statusBadge.innerText = "ALARM: HIGH TEMP";
                    statusBadge.className = "status-badge status-alarm";
                } else {
                    tempEl.classList.remove("alarm");
                    statusBadge.innerText = "NORMAL";
                    statusBadge.className = "status-badge status-ok";
                }
            } else {
                document.getElementById("tempValue").innerText = "N/A";
            }
        } catch (err) {
            console.error("Zabbix API Error:", err);
        }
    }

    function openSensorModal(name, itemKey) {
        document.getElementById("sensorName").innerText = name;
        document.getElementById("sensorModal").style.display = "block";
        
        fetchSensorData(itemKey);
        
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(() => fetchSensorData(itemKey), 3000);
    }

    function closeModal() {
        document.getElementById("sensorModal").style.display = "none";
        if (updateInterval) clearInterval(updateInterval);
    }
</script>
</body>
</html>
